<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git, VS Code & GitHub — Friendly Step-by-Step Setup</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #f6f1e3;
      --grid-line: rgba(92, 98, 68, 0.11);
      --olive-dark: #5c6244;
      --olive-mid: #7a8060;
      --charcoal: #2b2d22;
      --folder-yellow: #f6e58d;
      --accent-orange: #e07a2e;
      --close-pink: #f27b86;
      --terminal-blue: #2d6da3;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-cream);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--charcoal);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .font-mono-code {
      font-family: 'Space Mono', monospace;
    }

    /* Clean Retro Desktop Window */
    .desktop-window {
      background-color: #fbf8ef;
      border: 2.5px solid var(--charcoal);
      border-radius: 18px;
      box-shadow: 7px 7px 0px var(--charcoal);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .window-bar {
      background-color: var(--olive-dark);
      color: #ffffff;
      padding: 12px 20px;
      border-bottom: 2.5px solid var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
    }

    .window-orange-tab {
      height: 8px;
      background-color: #f2a663;
      margin: 0 32px;
      border-radius: 0 0 8px 8px;
      border: 2px solid var(--charcoal);
      border-top: none;
    }

    .close-dot {
      background-color: var(--close-pink);
      color: #ffffff;
      border: 1.5px solid #ffffff;
      border-radius: 6px;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .close-dot:hover {
      transform: scale(1.08);
      background-color: #e05663;
    }

    /* Tactile Buttons */
    .tactile-btn {
      border: 2px solid var(--charcoal);
      border-radius: 12px;
      box-shadow: 3px 3px 0px var(--charcoal);
      font-weight: 700;
      transition: all 0.12s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .tactile-btn:hover:not(:disabled) {
      transform: translate(-1.5px, -1.5px);
      box-shadow: 4.5px 4.5px 0px var(--charcoal);
    }
    .tactile-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--charcoal);
    }
    .tactile-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Choice Cards */
    .choice-card {
      background-color: #ffffff;
      border: 2.5px solid var(--charcoal);
      border-radius: 14px;
      box-shadow: 4px 4px 0px var(--charcoal);
      transition: all 0.15s ease;
      cursor: pointer;
      text-align: left;
    }
    .choice-card:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px var(--charcoal);
      background-color: #fefcf5;
    }
    .choice-card.selected {
      background-color: var(--folder-yellow);
      box-shadow: 5px 5px 0px var(--charcoal);
    }

    /* Command Box (Grey box + Blue header) */
    .terminal-card {
      border: 2px solid var(--charcoal);
      border-radius: 12px;
      background-color: #eaedf1;
      box-shadow: 3px 3px 0px var(--charcoal);
      overflow: hidden;
    }
    .terminal-header {
      background-color: var(--terminal-blue);
      color: #ffffff;
      padding: 8px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      border-bottom: 2px solid var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .terminal-body {
      padding: 16px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      line-height: 1.65;
      color: #1e2420;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Friendly "?" Info Dot */
    .help-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      background-color: var(--folder-yellow);
      color: var(--charcoal);
      border: 1.5px solid var(--charcoal);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 1.5px 1.5px 0px var(--charcoal);
      transition: all 0.12s ease;
      vertical-align: middle;
      margin-left: 5px;
    }
    .help-dot:hover {
      background-color: var(--accent-orange);
      color: #ffffff;
      transform: scale(1.12);
    }

    kbd {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      background-color: var(--folder-yellow);
      color: var(--charcoal);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1.5px solid var(--charcoal);
      border-bottom-width: 3px;
      display: inline-block;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide {
      animation: popIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body>

  <!-- MINIMAL TOP BAR WITH PROGRESS & QUICK JUMP -->
  <header class="sticky top-0 z-30 bg-[#5c6244] border-b-2 border-[#2b2d22] text-white">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <!-- Home / Reset to Start -->
      <button onclick="goToSlide('welcome')" class="tactile-btn bg-[#f6e58d] text-[#2b2d22] px-3 py-1.5 text-xs sm:text-sm" title="Start Over or Switch Track">
        <span class="font-mono-code font-bold bg-[#5c6244] text-white px-1.5 py-0.5 rounded text-xs">h</span>
        <span>Start / Switch Path</span>
      </button>

      <!-- OS Pill + All Pages Drawer Button -->
      <div class="flex items-center gap-2">
        <button id="sound-toggle-btn" onclick="toggleSound()" class="tactile-btn bg-[#fbf8ef] text-[#2b2d22] px-2.5 py-1.5 text-xs" title="Toggle Click Sound">
          <span id="sound-toggle-icon">🔊</span>
        </button>

        <button id="os-pill-btn" onclick="toggleOSQuick()" class="tactile-btn bg-[#fbf8ef] text-[#2b2d22] px-3 py-1.5 text-xs">
          <span id="os-pill-icon">🪟</span>
          <span id="os-pill-label">Windows</span>
        </button>

        <button onclick="toggleMapDrawer()" class="tactile-btn bg-[#e07a2e] text-white px-3 py-1.5 text-xs">
          <span>📁</span>
          <span>All Pages</span>
        </button>
      </div>
    </div>

    <!-- CALM MOTIVATIONAL PROGRESS BAR -->
    <div class="bg-[#494e35] border-t border-[#2b2d22] px-4 py-2">
      <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
        <div class="flex items-center gap-2 min-w-0">
          <span id="prog-pct" class="font-mono-code text-xs font-bold bg-[#f6e58d] text-[#2b2d22] px-2 py-0.5 rounded border border-[#2b2d22] shrink-0">Step 1</span>
          <span id="prog-encouragement" class="text-xs text-[#f6f1e3] truncate">Let's take this one small step at a time!</span>
        </div>
        <div class="w-36 sm:w-52 h-3 bg-[#2b2d22] rounded-full p-0.5 border border-[#f6f1e3]/30 shrink-0 overflow-hidden">
          <div id="prog-bar-fill" class="h-full bg-gradient-to-r from-[#f6e58d] to-[#e07a2e] rounded-full transition-all duration-300" style="width: 5%"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- SINGLE FOCUSED STEP WORKSPACE (ONE BITE-SIZED PAGE AT A TIME) -->
  <main class="flex-1 flex items-center justify-center px-4 py-6 sm:py-10">
    <div class="max-w-2xl w-full">

      <div class="desktop-window">
        <!-- Retro Window Bar -->
        <div class="window-bar">
          <div class="flex items-center gap-2 truncate">
            <span class="inline-block w-3 h-3 rounded-full bg-[#f6e58d] border border-[#2b2d22]"></span>
            <span id="window-path" class="truncate font-bold">C:\SETUP\welcome</span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span id="page-counter-badge" class="bg-[#2b2d22] text-[#f6e58d] px-2 py-0.5 rounded text-xs">Page 1</span>
            <button onclick="toggleMapDrawer()" class="close-dot" title="View All Pages">☰</button>
          </div>
        </div>

        <div class="window-orange-tab"></div>

        <!-- Dynamic Bite-Sized Slide Content -->
        <div id="slide-viewport" class="p-6 sm:p-9 space-y-6 animate-slide">
          <!-- Injected by JS -->
        </div>

        <!-- Clean Back / Next Footer -->
        <div id="slide-footer" class="bg-[#efe9d8] border-t-2 border-[#2b2d22] px-6 sm:px-9 py-4 flex items-center justify-between gap-3">
          <button id="btn-prev" onclick="stepPrev()" class="tactile-btn bg-white text-[#2b2d22] px-4 py-2.5 text-sm">
            <span>←</span> <span>Back</span>
          </button>

          <div id="footer-step-dots" class="hidden sm:flex items-center gap-1.5">
            <!-- Mini step dots -->
          </div>

          <button id="btn-next" onclick="stepNext()" class="tactile-btn bg-[#e07a2e] text-white px-6 py-2.5 text-sm">
            <span id="btn-next-label">Next Step</span> <span>→</span>
          </button>
        </div>
      </div>

      <!-- Bottom Quick Reference Dock (From the Retro Portfolio Theme) -->
      <div class="mt-6 bg-[#7a8060] border-2 border-[#2b2d22] rounded-2xl p-3 shadow-[4px_4px_0px_#2b2d22] flex flex-wrap items-center justify-center gap-3">
        <button onclick="goToSlide('cheat_sheet')" class="tactile-btn bg-[#fbf8ef] text-[#2b2d22] px-3.5 py-1.5 text-xs">
          <span>📋</span> <span>Command Cheat Sheet</span>
        </button>
        <button onclick="goToSlide('troubleshoot')" class="tactile-btn bg-[#fbf8ef] text-[#2b2d22] px-3.5 py-1.5 text-xs">
          <span>🩺</span> <span>Stuck? Fix Common Errors</span>
        </button>
        <button onclick="goToSlide('all_links')" class="tactile-btn bg-[#fbf8ef] text-[#2b2d22] px-3.5 py-1.5 text-xs">
          <span>🔗</span> <span>All 12 Download Links</span>
        </button>
      </div>

    </div>
  </main>

  <!-- ALL PAGES DRAWER (JUMP TO ANY MICRO-PAGE) -->
  <div id="map-drawer" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4" onclick="toggleMapDrawer()">
    <div class="desktop-window max-w-lg w-full max-h-[82vh] flex flex-col" onclick="event.stopPropagation()">
      <div class="window-bar">
        <span class="font-bold">📁 All Setup Pages (Jump Anywhere)</span>
        <button onclick="toggleMapDrawer()" class="close-dot">✕</button>
      </div>
      <div class="p-5 overflow-y-auto space-y-2 bg-[#fbf8ef]" id="map-drawer-list">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- HELP DOT ("?") POPUP MODAL -->
  <div id="help-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4" onclick="closeHelp()">
    <div class="desktop-window max-w-md w-full" onclick="event.stopPropagation()">
      <div class="window-bar">
        <span id="help-modal-path" class="font-bold">💡 Beginner Tip</span>
        <button onclick="closeHelp()" class="close-dot">✕</button>
      </div>
      <div class="p-6 space-y-4 bg-[#fbf8ef]">
        <div class="inline-block font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">
          Plain-English Explanation
        </div>
        <h3 id="help-modal-title" class="text-lg font-extrabold text-[#5c6244]"></h3>
        <div id="help-modal-body" class="text-sm text-[#2b2d22] leading-relaxed space-y-2.5"></div>
        <div class="pt-2 flex justify-end">
          <button onclick="closeHelp()" class="tactile-btn bg-[#e07a2e] text-white px-5 py-2 text-xs">Got it! ✓</button>
        </div>
      </div>
    </div>
  </div>

  <!-- COPY TOAST -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-[#2b2d22] text-[#f6e58d] border-2 border-[#f6e58d] rounded-xl px-4 py-2.5 font-mono-code text-xs font-bold shadow-lg">
    <span id="toast-text">✅ Copied to clipboard!</span>
  </div>

  <script>
    // =========================================================================
    // PERSISTENT WIZARD STATE
    // =========================================================================
    const defaultState = {
      os: 'windows',         // 'windows' | 'linux'
      track: 'full',         // 'full' | 'git_only' | 'vscode_only' | 'github_only'
      slideId: 'welcome',
      installerPage: 0,      // 0, 1, 2 (breaks the 11 Windows screens into 3 bite-sized pages)
      linuxDistro: 'ubuntu', // 'ubuntu' | 'fedora' | 'arch' | 'opensuse'
      linuxVscMethod: 'deb', // 'deb' | 'rpm' | 'snap' | 'arch'
      authMethod: 'ssh',     // 'ssh' | 'https' | 'gh'
      userName: '',
      userEmail: '',
      userGithub: '',
      soundEnabled: true
    };

    let state = { ...defaultState };
    try {
      const saved = localStorage.getItem('git_friendly_wizard_v2');
      if (saved) state = { ...defaultState, ...JSON.parse(saved) };
    } catch (e) {}

    function saveState() {
      try {
        localStorage.setItem('git_friendly_wizard_v2', JSON.stringify(state));
      } catch (e) {}
    }

    // =========================================================================
    // EXACT MP3 AUDIO PLAYER (emilianodleon-select-button-ui-395763.mp3 @ 100% VOLUME)
    // =========================================================================
    const SOUND_FILE_PATH = 'emilianodleon-select-button-ui-395763.mp3';
    const baseClickAudio = new Audio(SOUND_FILE_PATH);
    baseClickAudio.preload = 'auto';
    baseClickAudio.volume = 1.0;

    function playPopSound() {
      if (!state.soundEnabled) return;
      try {
        // Clone the audio node so rapid clicks overlap cleanly without cutting off
        const soundClone = baseClickAudio.cloneNode();
        soundClone.volume = 1.0; // Keep exact original volume (100%)
        const playPromise = soundClone.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Fallback to resetting the base audio instance if clone playback is restricted
            baseClickAudio.currentTime = 0;
            baseClickAudio.volume = 1.0;
            baseClickAudio.play().catch(() => {});
          });
        }
      } catch (e) {
        // Ignore playback errors if file isn't in folder yet
      }
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      saveState();
      const iconEl = document.getElementById('sound-toggle-icon');
      if (iconEl) iconEl.textContent = state.soundEnabled ? '🔊' : '🔇';
      if (state.soundEnabled) {
        playPopSound();
        showToast('🔊 Button sound enabled');
      } else {
        showToast('🔇 Button sound muted');
      }
    }

    // Automatically trigger the MP3 sound on any button, summary, or choice card click
    document.addEventListener('click', (e) => {
      const clickable = e.target.closest('button, a.tactile-btn, summary, .choice-card, .help-dot, .close-dot');
      if (!clickable || clickable.disabled) return;
      if (clickable.id === 'sound-toggle-btn') return;
      playPopSound();
    });

    // =========================================================================
    // BEGINNER-FRIENDLY "?" INFO DOTS DICTIONARY
    // =========================================================================
    const HELP_NOTES = {
      git_vs_github: {
        title: "Git vs. GitHub — What's the difference?",
        body: `<p><strong>Git</strong> is a free tool on your computer that saves checkpoints ("commits") of your code so you can rewind if something breaks.</p>
               <p><strong>GitHub</strong> is a website where you upload those checkpoints online so your team can collaborate and your code is backed up safely.</p>`
      },
      git_bash: {
        title: "What is Git Bash?",
        body: `<p>Windows uses different terminal commands than Linux and macOS. <strong>Git Bash</strong> comes bundled inside Git for Windows and gives you a friendly Linux-style terminal on Windows.</p>
               <p>If you use Linux, your normal Terminal app already runs Bash automatically!</p>`
      },
      admin_sudo: {
        title: "What does Administrator / sudo mean?",
        body: `<p>To install software, your computer asks for permission. On Windows, you click <strong>Yes</strong> on the pop-up prompt. On Linux, commands start with <code>sudo</code>, which asks for your computer login password.</p>`
      },
      main_branch: {
        title: "Why type 'main' for the branch name?",
        body: `<p>A branch is a timeline of your project. GitHub calls the primary timeline <code>main</code>. Setting Git to use <code>main</code> ensures your laptop and GitHub match right away.</p>`
      },
      path_explain: {
        title: "What is PATH?",
        body: `<p><code>PATH</code> is your computer's list of shortcuts for terminal commands. Ticking <strong>Add to PATH</strong> lets you type <code>git</code> or <code>code</code> inside any folder.</p>
               <p><strong>Important tip:</strong> Always close and reopen your terminal window after installing so it picks up the new PATH!</p>`
      },
      crlf_explain: {
        title: "What are Line Endings (CRLF vs LF)?",
        body: `<p>Windows and Linux use slightly different invisible characters at the end of each line of text. This setting tells Git to handle them automatically so teammates on different operating systems never get weird file conflicts.</p>`
      },
      code_wait: {
        title: "Why set the editor to 'code --wait'?",
        body: `<p>Without this, Git sometimes opens a confusing terminal editor called Vim. Setting <code>code --wait</code> tells Git to open VS Code whenever it needs you to type a message!</p>`
      },
      private_email: {
        title: "Keeping your personal email private",
        body: `<p>Every Git commit includes the email you set in Git. If you don't want your personal email visible on public repos, open <a href="https://github.com/settings/emails" target="_blank" class="underline font-bold">github.com/settings/emails</a>, tick <strong>Keep my email addresses private</strong>, and copy the special <code>ID+USERNAME@users.noreply.github.com</code> address!</p>`
      },
      ssh_vs_https: {
        title: "SSH Key vs. HTTPS — Which should I pick?",
        body: `<p><strong>SSH Key (Recommended):</strong> You generate a digital key pair once on your laptop and paste the public half into GitHub. You never have to log in again!</p>
               <p><strong>HTTPS:</strong> Useful if your office or campus Wi-Fi blocks SSH (port 22). On Windows, a browser sign-in window pops up automatically.</p>`
      },
      pub_key: {
        title: "Public Key (.pub) vs Private Key",
        body: `<p>The file ending in <code>.pub</code> is your <strong>Public Key</strong>—it is completely safe to copy and paste into GitHub.</p>
               <p>Never share the file <em>without</em> <code>.pub</code> (that's your private key that stays on your computer).</p>`
      }
    };

    function showHelp(key) {
      const item = HELP_NOTES[key];
      if (!item) return;
      document.getElementById('help-modal-title').textContent = item.title;
      document.getElementById('help-modal-body').innerHTML = item.body;
      document.getElementById('help-modal').classList.remove('hidden');
    }

    function closeHelp() {
      document.getElementById('help-modal').classList.add('hidden');
    }

    // =========================================================================
    // COMMAND BOX HELPER (ONE-CLICK COPY + PERSONALIZED PLACEHOLDERS)
    // =========================================================================
    let cmdSeq = 0;
    const cmdRawMap = {};

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function cmdBox(runWhere, displayHtml, rawText) {
      cmdSeq++;
      const cid = 'c_' + cmdSeq;
      cmdRawMap[cid] = rawText || displayHtml.replace(/<[^>]+>/g, '');
      return `
        <div class="terminal-card my-3">
          <div class="terminal-header">
            <span class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#f6e58d] inline-block"></span>
              <span>RUN IN: ${escapeHtml(runWhere)}</span>
            </span>
            <button type="button" onclick="copyCmd('${cid}', this)" class="bg-[#f6e58d] hover:bg-[#e07a2e] text-[#2b2d22] hover:text-white border border-[#2b2d22] rounded-md px-3 py-0.5 text-xs font-bold transition cursor-pointer">
              📋 Copy
            </button>
          </div>
          <pre class="terminal-body">${displayHtml}</pre>
        </div>
      `;
    }

    function copyCmd(cid, btn) {
      const txt = cmdRawMap[cid] || '';
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('✅ Command copied! Paste it into your terminal.');
        if (btn) {
          const old = btn.innerHTML;
          btn.innerHTML = '✓ Copied!';
          setTimeout(() => { btn.innerHTML = old; }, 1400);
        }
      } catch (err) {}
      document.body.removeChild(ta);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.add('hidden'), 2400);
    }

    // =========================================================================
    // DYNAMIC SLIDE SEQUENCE (RETURNS THE EXACT LIST OF MICRO-PAGES FOR USER)
    // =========================================================================
    function getSlideDeck() {
      const isWin = state.os === 'windows';
      const deck = [
        { id: 'welcome', title: 'Choose Your OS & Goal', path: '00_welcome' },
        { id: 'overview', title: 'Meet Your 4 Tools', path: '01_tools_overview', tracks: ['full', 'git_only', 'vscode_only'] },
        { id: 'prereq', title: 'Quick Checklist Before Starting', path: '01_checklist', tracks: ['full', 'git_only', 'vscode_only'] }
      ];

      // OS-Specific Git Installation Slides
      if (isWin) {
        deck.push(

        // ---------------------------------------------------------------------

        // ---------------------------------------------------------------------
        // LINUX SLIDE 5: VERIFY GIT ON LINUX (STEP 3.2)
        // ---------------------------------------------------------------------
        case 'lin_git_verify':
          return `
            <div class="space-y-2">

        // ---------------------------------------------------------------------
        // LINUX SLIDE 6: INSTALL VS CODE ON LINUX (STEP 3.3)
        // ---------------------------------------------------------------------
        case 'lin_vsc_install':

`sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc
sudo tee /etc/yum.repos.d/vscode.repo > /dev/null << 'EOT'
[code]
name=Visual Studio Code
baseurl=https://packages.microsoft.com/yumrepos/vscode
enabled=1
gpgcheck=1
gpgkey=https://packages.microsoft.com/keys/microsoft.asc
EOT
sudo dnf check-update
sudo dnf install code -y`)}

              ${cmdBox('Linux Terminal', `yay -S visual-studio-code-bin`, `yay -S visual-studio-code-bin`)}

        // ---------------------------------------------------------------------
        // LINUX SLIDE 7: VERIFY VS CODE ON LINUX (STEP 3.4)

        case 'lin_vsc_verify':

        // ---------------------------------------------------------------------

        case 'cfg_defaults':

            ${cmdBox(
              termLabel,
              `git config --global init.defaultBranch main\ngit config --global core.editor "code --wait"\n${crlfCmd}`,

        // ---------------------------------------------------------------------
        // SLIDE: VERIFY GIT CONFIG (STEP 4.4)
        // ---------------------------------------------------------------------
        case 'cfg_verify':
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 4 • Step 4.4</span>

              termLabel,

        // ---------------------------------------------------------------------

        case 'auth_choose':
          return `

              <h2 class="text-2xl font-extrabold text-[#5c6244]">
                How Should Git Prove Who You Are?
                <button onclick="showHelp('ssh_vs_https')" class="help-dot">?</button>
              </h2>
              <p class="text-sm text-[#2b2d22]/80">
                GitHub no longer accepts account passwords in the terminal. <strong>Pick ONE method below</strong> (we'll only show you the steps for the one you pick!):
              </p>
            </div>

            <div class="space-y-3">
              <button type="button" onclick="pickAuth('ssh')" class="choice-card w-full p-4 flex items-start gap-3.5 ${state.authMethod === 'ssh' ? 'selected' : ''}">
                <span class="text-2xl">🔑</span>
                <div>
                  <div class="font-extrabold text-sm sm:text-base">Method A: SSH Key (Recommended for your laptop)</div>
                  <div class="text-xs text-[#2b2d22]/80 mt-0.5">Set up once in 2 minutes—never type a password or token again.</div>
                </div>
              </button>

              <button type="button" onclick="pickAuth('https')" class="choice-card w-full p-4 flex items-start gap-3.5 ${state.authMethod === 'https' ? 'selected' : ''}">
                <span class="text-2xl">🌐</span>
                <div>
                  <div class="font-extrabold text-sm sm:text-base">Method B: HTTPS Sign-In / Token</div>
                  <div class="text-xs text-[#2b2d22]/80 mt-0.5">Best for corporate networks that block SSH. On Windows, opens a browser sign-in automatically.</div>
                </div>
              </button>

              <button type="button" onclick="pickAuth('gh')" class="choice-card w-full p-4 flex items-start gap-3.5 ${state.authMethod === 'gh' ? 'selected' : ''}">
                <span class="text-2xl">⚡</span>
                <div>
                  <div class="font-extrabold text-sm sm:text-base">Method C: GitHub CLI (<code>gh</code>)</div>
                  <div class="text-xs text-[#2b2d22]/80 mt-0.5">Optional tool that logs in with a single command.</div>
                </div>
              </button>
            </div>
          `;

        // ---------------------------------------------------------------------
        // SLIDE: SSH STEP 1 — CREATE & ADD KEY TO AGENT (STEP A1 & A2)
        // ---------------------------------------------------------------------
        case 'ssh_create':
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 6 • Method A (Step 1 of 3)</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">Generate Your SSH Key</h2>
              <p class="text-sm text-[#2b2d22]/80">
                <strong>Step A1:</strong> Run this command, then press <kbd>Enter</kbd> 3 times to accept the default file location (a passphrase is optional):
              </p>
            </div>

            ${cmdBox(
              termLabel,
              `ssh-keygen -t ed25519 -C "${escapeHtml(myEmail)}"`,
              `ssh-keygen -t ed25519 -C "${myEmail}"`
            )}

            <p class="text-sm text-[#2b2d22]/80">
              <strong>Step A2:</strong> Start the SSH agent and load your new key:
            </p>
            ${cmdBox(
              termLabel,
              `eval "$(ssh-agent -s)"\nssh-add ~/.ssh/id_ed25519`,
              `eval "$(ssh-agent -s)"\nssh-add ~/.ssh/id_ed25519`
            )}
          `;

        // ---------------------------------------------------------------------
        // SLIDE: SSH STEP 2 — COPY & PASTE ON GITHUB (STEP A3 & A4)
        // ---------------------------------------------------------------------
        case 'ssh_add_gh':
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 6 • Method A (Step 2 of 3)</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">
                Add Your Public Key to GitHub
                <button onclick="showHelp('pub_key')" class="help-dot">?</button>
              </h2>
              <p class="text-sm text-[#2b2d22]/80">
                <strong>Step A3:</strong> Copy your public key (the file ending in <code>.pub</code>):
              </p>
            </div>

            ${isWin
              ? cmdBox('Git Bash (copies straight to clipboard!)', `clip < ~/.ssh/id_ed25519.pub`, `clip < ~/.ssh/id_ed25519.pub`)

            }

            <div class="bg-white border-2 border-[#2b2d22] rounded-2xl p-4 space-y-2.5 shadow-[3px_3px_0px_#2b2d22]">
              <p class="text-xs sm:text-sm"><strong>Step A4: Paste it on GitHub:</strong></p>
              <ol class="list-decimal pl-5 space-y-1 text-xs sm:text-sm">
                <li>Open <a href="https://github.com/settings/keys" target="_blank" class="underline font-bold text-[#1e5f8a]">https://github.com/settings/keys</a> and click <strong>New SSH key</strong>.</li>
                <li>Type a Title (like <code>My Laptop</code>), keep <strong>Key type: Authentication Key</strong>, paste your key in the box, and click <strong>Add SSH key</strong>.</li>
              </ol>
            </div>
          `;

        // ---------------------------------------------------------------------
        // SLIDE: SSH STEP 3 — TEST CONNECTION (STEP A5)
        // ---------------------------------------------------------------------
        case 'ssh_test':
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 6 • Method A (Step 3 of 3)</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">Test Your SSH Connection</h2>
              <p class="text-sm text-[#2b2d22]/80">
                <strong>Step A5:</strong> Run this command. If asked about the host fingerprint, type <code>yes</code> and press <kbd>Enter</kbd>:
              </p>
            </div>

            ${cmdBox(termLabel, `ssh -T git@github.com`, `ssh -T git@github.com`)}

            <div class="bg-[#e6f2d9] border-2 border-[#2b2d22] rounded-xl p-4 text-xs sm:text-sm space-y-1">

              <p><code>Hi ${escapeHtml(myUser)}! You've successfully authenticated, but GitHub does not provide shell access.</code> (That message is 100% normal!)</p>
            </div>

            <p class="text-xs text-[#2b2d22]/80">
              💡 <strong>Remember:</strong> Whenever you copy a repository URL from GitHub, always pick the <strong>SSH</strong> tab (<code>git@github.com:${escapeHtml(myUser)}/REPO.git</code>).

          `;

        // ---------------------------------------------------------------------
        // SLIDE: HTTPS METHOD B
        // ---------------------------------------------------------------------
        case 'https_setup':
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 6 • Method B (HTTPS)</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">Connect Using HTTPS</h2>
            </div>

            ${isWin ? `
              <div class="bg-white border-2 border-[#2b2d22] rounded-2xl p-5 space-y-3 shadow-[3px_3px_0px_#2b2d22]">
                <div class="text-base font-extrabold text-[#5c6244]">🪟 On Windows: Zero Extra Setup!</div>
                <p class="text-sm leading-relaxed">
                  The first time you run <code>git push</code> or <code>git clone</code> on a private repository using an <code>https://</code> URL, <strong>Git Credential Manager</strong> automatically pops open a window.
                </p>
                <p class="text-sm leading-relaxed">
                  Simply click <strong>Sign in with your browser</strong> and approve it on GitHub. Your login is saved automatically!
                </p>
              </div>
            ` : `
              <div class="bg-white border-2 border-[#2b2d22] rounded-2xl p-4 space-y-3 shadow-[3px_3px_0px_#2b2d22] text-xs sm:text-sm">
                <p><strong>1. Create a token:</strong> Open <a href="https://github.com/settings/tokens" target="_blank" class="underline font-bold text-[#1e5f8a]">github.com/settings/tokens</a> &gt; <strong>Generate new token (classic)</strong>. Give it a name, expiry date, tick the <code>repo</code> scope, and copy the token.</p>
                <p><strong>2. Tell Git to remember it:</strong></p>
                ${cmdBox('Linux Terminal', `git config --global credential.helper 'cache --timeout=3600'\n# or (plain-text file, less secure):\ngit config --global credential.helper store`, `git config --global credential.helper 'cache --timeout=3600'`)}
                <p><strong>3.</strong> Next time you run <code>git push</code> over HTTPS, enter your GitHub username and paste the token as the password.</p>
              </div>
            `}
          `;

        // ---------------------------------------------------------------------
        // SLIDE: GITHUB CLI METHOD C
        // ---------------------------------------------------------------------
        case 'gh_cli_setup':
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 6 • Method C (GitHub CLI)</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">Connect Using GitHub CLI</h2>
              <p class="text-sm text-[#2b2d22]/80">
                Download from <a href="https://cli.github.com" target="_blank" class="underline font-bold text-[#1e5f8a]">https://cli.github.com</a> (or <a href="https://github.com/cli/cli/blob/trunk/docs/install_linux.md" target="_blank" class="underline font-bold text-[#1e5f8a]">Linux install guide</a>), then run:
              </p>
            </div>

            ${cmdBox(
              termLabel,
              `gh auth login\n# Choose: GitHub.com > SSH or HTTPS > Login with a web browser`,
              `gh auth login`
            )}
          `;

        // ---------------------------------------------------------------------
        // SLIDE: CONNECT VS CODE TO GIT & GITHUB (STEPS 7.1, 7.2, 7.3)
        // ---------------------------------------------------------------------
        case 'vsc_connect':
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 7 • Step 7.1–7.3</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">Connect VS Code to GitHub</h2>
              <p class="text-sm text-[#2b2d22]/80">Let's link your GitHub account inside VS Code:</p>
            </div>

            <div class="bg-white border-2 border-[#2b2d22] rounded-2xl p-4 space-y-3 shadow-[3px_3px_0px_#2b2d22] text-xs sm:text-sm">
              <div>
                <strong>1. Check Source Control (<kbd>Ctrl+Shift+G</kbd>):</strong> VS Code finds Git automatically. (If it ever says Git not found, restart VS Code or set <code>git.path</code> in Settings <kbd>Ctrl+,</kbd> to <code>C:\\Program Files\\Git\\cmd\\git.exe</code> on Windows or <code>/usr/bin/git</code> on Linux.)
              </div>
              <div class="pt-2 border-t border-[#2b2d22]/15">
                <strong>2. Sign in to GitHub:</strong>
                <ul class="list-disc pl-5 mt-1 space-y-1">
                  <li>Click the <strong>Accounts</strong> icon (person silhouette) at the bottom-left corner of VS Code.</li>
                  <li>Click <strong>Sign in with GitHub</strong> and click <strong>Authorize Visual-Studio-Code</strong> in your browser.</li>
                </ul>
              </div>
            </div>
          `;

        // ---------------------------------------------------------------------
        // SLIDE: VS CODE EXTENSIONS & SOURCE CONTROL PANEL (STEPS 7.4 & 7.5)
        // ---------------------------------------------------------------------
        case 'vsc_panel':
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 7 • Step 7.4 &amp; 7.5</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">Helpful VS Code Buttons &amp; Extensions</h2>
            </div>

            <div class="bg-white border-2 border-[#2b2d22] rounded-xl p-3.5 space-y-2 text-xs sm:text-sm">
              <div class="font-bold text-[#5c6244]">Optional Extensions (Press <kbd>Ctrl+Shift+X</kbd> to search &amp; install):</div>
              <div class="flex flex-wrap gap-2">
                <span class="bg-[#f6e58d] border border-[#2b2d22] px-2.5 py-1 rounded font-bold">GitHub Pull Requests</span>
                <span class="bg-[#f6e58d] border border-[#2b2d22] px-2.5 py-1 rounded font-bold">GitLens</span>
                <span class="bg-[#f6e58d] border border-[#2b2d22] px-2.5 py-1 rounded font-bold">Git Graph</span>
              </div>
            </div>

            <div class="overflow-x-auto border-2 border-[#2b2d22] rounded-xl bg-white">
              <table class="w-full text-left border-collapse text-xs sm:text-sm">
                <thead>
                  <tr class="bg-[#5c6244] text-white font-mono-code">
                    <th class="p-2.5">Button in VS Code</th>
                    <th class="p-2.5">What it does</th>
                    <th class="p-2.5">Terminal equivalent</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#2b2d22]/20">
                  <tr><td class="p-2.5 font-bold">Click <code>+</code> next to a file</td><td class="p-2.5">Stage the change</td><td class="p-2.5"><code>git add FILE</code></td></tr>
                  <tr class="bg-[#fbf8ef]"><td class="p-2.5 font-bold">Type message &amp; click Commit</td><td class="p-2.5">Save snapshot locally</td><td class="p-2.5"><code>git commit -m "msg"</code></td></tr>
                  <tr><td class="p-2.5 font-bold">Sync Changes / Publish</td><td class="p-2.5">Push/pull with GitHub</td><td class="p-2.5"><code>git push</code> / <code>git pull</code></td></tr>
                  <tr class="bg-[#fbf8ef]"><td class="p-2.5 font-bold">Bottom-left branch name</td><td class="p-2.5">Switch/create branch</td><td class="p-2.5"><code>git switch BRANCH</code></td></tr>
                </tbody>
              </table>
            </div>
          `;

        // ---------------------------------------------------------------------
        // SLIDE: YOUR FIRST REPO — CREATE & CLONE (PART 8 STEP 1-3)
        // ---------------------------------------------------------------------
        case 'repo_start':
          const cloneUrl = state.authMethod === 'https'
            ? `https://github.com/${myUser}/hello-git.git`
            : `git@github.com:${myUser}/hello-git.git`;

          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 8 • Step 1 of 2</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">Create &amp; Clone Your First Repo</h2>
              <p class="text-sm text-[#2b2d22]/80">Let's test everything end-to-end!</p>
            </div>

            <div class="bg-white border-2 border-[#2b2d22] rounded-xl p-4 space-y-2 text-xs sm:text-sm">
              <p><strong>1.</strong> Open <a href="https://github.com/new" target="_blank" class="underline font-bold text-[#1e5f8a]">https://github.com/new</a>, name the repository <code>hello-git</code>, tick <strong>Add a README file</strong>, and click <strong>Create repository</strong>.</p>
              <p><strong>2.</strong> Click the green <strong>Code</strong> button and copy the <strong>${state.authMethod === 'https' ? 'HTTPS' : 'SSH'}</strong> URL.</p>
              <p><strong>3.</strong> Run these commands to download (clone) it and open VS Code:</p>
            </div>

            ${cmdBox(
              termLabel,
`cd ~
mkdir -p projects && cd projects
git clone ${escapeHtml(cloneUrl)}
cd hello-git
code .`,
`cd ~
mkdir -p projects && cd projects
git clone ${cloneUrl}
cd hello-git
code .`
            )}
          `;

        // ---------------------------------------------------------------------
        // SLIDE: YOUR FIRST REPO — COMMIT & PUSH (PART 8 STEP 4)
        // ---------------------------------------------------------------------
        case 'repo_push':
          const originUrl = state.authMethod === 'https'
            ? `https://github.com/${myUser}/my-project.git`
            : `git@github.com:${myUser}/my-project.git`;

          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 8 • Final Milestone!</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">Commit &amp; Push to GitHub</h2>
              <p class="text-sm text-[#2b2d22]/80">
                Edit <code>README.md</code> inside VS Code, save the file (<kbd>Ctrl+S</kbd>), then run these 4 commands in the VS Code terminal (<kbd>Ctrl+&#96;</kbd>):
              </p>
            </div>

            ${cmdBox(
              'VS Code Terminal / Git Bash / Linux Terminal',
`git status
git add .
git commit -m "Update README"
git push`,
`git status
git add .
git commit -m "Update README"
git push`
            )}

            <div class="bg-[#e6f2d9] border-2 border-[#2b2d22] rounded-xl p-3.5 text-xs sm:text-sm font-bold text-[#3b5926]">
              🎉 Refresh your GitHub repository page in your browser—you'll see your updated README live online!
            </div>

            <details class="bg-white border-2 border-[#2b2d22] rounded-xl p-3 text-xs">
              <summary class="font-bold cursor-pointer text-[#5c6244]">➕ Bonus: Starting from a brand-new local folder instead of cloning (Option 2)</summary>
              <p class="mt-2">Create an empty repo on <a href="https://github.com/new" target="_blank" class="underline font-bold">github.com/new</a> (do not tick README), then run:</p>
              ${cmdBox(
                termLabel,
`mkdir my-project && cd my-project
git init
echo "# My Project" > README.md
git add README.md
git commit -m "First commit"
git branch -M main
git remote add origin ${escapeHtml(originUrl)}
git push -u origin main`,
`mkdir my-project && cd my-project
git init
echo "# My Project" > README.md
git add README.md
git commit -m "First commit"
git branch -M main
git remote add origin ${originUrl}
git push -u origin main`
              )}
            </details>
          `;

        // ---------------------------------------------------------------------
        // SLIDE: CHEAT SHEET (PART 9)
        // ---------------------------------------------------------------------
        case 'cheat_sheet':
          const cheats = [
            ['git status', 'Show changed, staged and untracked files'],
            ['git add FILE / git add .', 'Stage one file / all changes'],
            ['git commit -m "msg"', 'Save staged changes with a message'],
            ['git push / git push -u origin main', 'Upload commits to GitHub (-u sets upstream the first time)'],
            ['git pull', 'Download and merge new changes from GitHub'],
            ['git clone URL', 'Copy a GitHub repo to your computer'],
            ['git log --oneline', 'Short history of commits'],
            ['git diff', 'Show unstaged changes'],
            ['git branch / git switch -c NAME', 'List branches / create and switch to a new branch'],
            ['git remote -v', 'Show linked GitHub URLs'],
            ['git restore FILE', 'Discard uncommitted changes to a file']
          ];
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 9 • Quick Reference</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">Command Cheat Sheet</h2>
            </div>

            <div class="overflow-x-auto border-2 border-[#2b2d22] rounded-xl bg-white">
              <table class="w-full text-left border-collapse text-xs sm:text-sm">
                <thead>
                  <tr class="bg-[#5c6244] text-white font-mono-code">
                    <th class="p-2.5">Command</th>
                    <th class="p-2.5">Purpose</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#2b2d22]/20">
                  ${cheats.map((r, i) => `
                    <tr class="${i % 2 ? 'bg-[#fbf8ef]' : ''}">
                      <td class="p-2 font-mono-code font-bold text-[#c85212]"><code>${escapeHtml(r[0])}</code></td>
                      <td class="p-2">${escapeHtml(r[1])}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;

        // ---------------------------------------------------------------------
        // SLIDE: TROUBLESHOOTING (PART 10 — ACCORDION CARDS!)
        // ---------------------------------------------------------------------
        case 'troubleshoot':
          const fixes = [
            ["'git' is not recognized (Windows)", "PATH not updated or terminal opened before install.", "Close all terminals and reopen. If still failing, re-run the Git installer and select 'Git from the command line and also from 3rd-party software'."],
            ["'code' is not recognized", "VS Code was installed without Add to PATH.", "Re-run the VS Code installer with Add to PATH ticked, or in VS Code press Ctrl+Shift+P and run Shell Command: Install 'code' command in PATH (Linux/macOS). Reopen the terminal."],
            ["Permission denied (publickey)", "GitHub does not have your public key, or the agent does not have the private key.", "Redo the SSH steps, then run ssh -T git@github.com. Check with ssh-add -l that your key is loaded."],
            ["Authentication failed / password not supported (HTTPS)", "GitHub does not accept account passwords over HTTPS.", "Use a Personal Access Token as the password, or sign in through Git Credential Manager, or switch to SSH."],
            ["Author identity unknown / Please tell me who you are", "user.name / user.email not set.", "Run git config --global user.name and user.email (Part 4)."],
            ["Host key verification failed", "Fingerprint not accepted.", "Run ssh -T git@github.com and answer yes."],
            ["'LF will be replaced by CRLF' warning (Windows)", "Line-ending conversion notice.", "Completely harmless! Keep core.autocrlf true."],
            ["Rejected push: remote contains work you do not have", "Someone (or GitHub's README) changed the remote first.", "Run git pull to merge, then git push again."],
            ["Terminal in VS Code is not Git Bash (Windows)", "Default profile not set.", "Press Ctrl+Shift+P → Terminal: Select Default Profile → Git Bash."]
          ];
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 10 • Error Doctor</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">Troubleshooting Common Errors</h2>
              <p class="text-sm text-[#2b2d22]/80">Click whichever error message you're seeing to expand the fix:</p>
            </div>

            <div class="space-y-2 max-h-96 overflow-y-auto pr-1">
              ${fixes.map(f => `
                <details class="bg-white border-2 border-[#2b2d22] rounded-xl p-3 group">
                  <summary class="font-bold text-xs sm:text-sm cursor-pointer text-[#b84509] flex items-center justify-between">
                    <span>⚠️ ${escapeHtml(f[0])}</span>
                    <span class="text-xs text-[#5c6244]">View Fix ▼</span>
                  </summary>
                  <div class="mt-2 pt-2 border-t border-[#2b2d22]/15 text-xs sm:text-sm space-y-1">
                    <p><strong>Cause:</strong> ${escapeHtml(f[1])}</p>
                    <p class="text-[#3b5926]"><strong>✅ Fix:</strong> ${escapeHtml(f[2])}</p>
                  </div>
                </details>
              `).join('')}
            </div>
          `;

        // ---------------------------------------------------------------------
        // SLIDE: ALL 12 LINKS IN ONE PLACE (PART 11)
        // ---------------------------------------------------------------------
        case 'all_links':
          const links = [
            ['Git for Windows (includes Git Bash)', 'https://git-scm.com/download/win'],
            ['Git for Linux install instructions', 'https://git-scm.com/download/linux'],
            ['Git documentation and book', 'https://git-scm.com/doc'],
            ['VS Code download (Windows/Linux)', 'https://code.visualstudio.com/download'],
            ['VS Code Git documentation', 'https://code.visualstudio.com/docs/sourcecontrol/overview'],
            ['Create a GitHub account', 'https://github.com/signup'],
            ['GitHub SSH keys settings', 'https://github.com/settings/keys'],
            ['GitHub personal access tokens', 'https://github.com/settings/tokens'],
            ['GitHub email privacy settings', 'https://github.com/settings/emails'],
            ['Create a new GitHub repository', 'https://github.com/new'],
            ['GitHub CLI', 'https://cli.github.com'],
            ['GitHub official docs (authentication)', 'https://docs.github.com/en/authentication']
          ];
          return `
            <div class="space-y-2">
              <span class="font-mono-code text-xs font-bold bg-[#f6e58d] px-2.5 py-1 rounded border border-[#2b2d22]">Part 11 • Official Bookmarks</span>
              <h2 class="text-2xl font-extrabold text-[#5c6244]">All 12 Official Links in One Place</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-96 overflow-y-auto pr-1">
              ${links.map(l => `
                <a href="${escapeHtml(l[1])}" target="_blank" rel="noopener" class="bg-white hover:bg-[#f6e58d] border-2 border-[#2b2d22] rounded-xl p-3 transition flex flex-col justify-between">
                  <span class="font-bold text-xs sm:text-sm">${escapeHtml(l[0])} ↗</span>
                  <span class="font-mono-code text-[11px] text-[#1e5f8a] underline truncate mt-1">${escapeHtml(l[1])}</span>
                </a>
              `).join('')}
            </div>
          `;
      }
    }

    // =========================================================================
    // MASTER RENDER & NAVIGATION
    // =========================================================================
    function render() {
      const deck = getSlideDeck();
      let idx = deck.findIndex(s => s.id === state.slideId);
      if (idx === -1) {
        idx = 0;
        state.slideId = deck[0].id;
      }
      const current = deck[idx];
      const total = deck.length;
      const pct = Math.round(((idx + 1) / total) * 100);

      // Update Sound Icon
      const soundIcon = document.getElementById('sound-toggle-icon');
      if (soundIcon) soundIcon.textContent = state.soundEnabled ? '🔊' : '🔇';

      // Update OS Pill
      document.getElementById('os-pill-icon').textContent = state.os === 'windows' ? '🪟' : '🐧';
      document.getElementById('os-pill-label').textContent = state.os === 'windows' ? 'Windows' : 'Linux';

      // Update Window Bar Path
      const rootPrefix = state.os === 'windows' ? 'C:\\SETUP\\' : '~/setup/';
      document.getElementById('window-path').textContent = rootPrefix + current.path;
      document.getElementById('page-counter-badge').textContent = `Page ${idx + 1} of ${total}`;

      // Update Progress Bar
      document.getElementById('prog-pct').textContent = `${pct}%`;
      document.getElementById('prog-bar-fill').style.width = `${pct}%`;

      let motivate = "One small step at a time—you've got this!";
      if (pct >= 25 && pct < 50) motivate = "Great start! Your tools are coming together.";
      else if (pct >= 50 && pct < 80) motivate = "Over halfway there! Keep going!";
      else if (pct >= 80 && pct < 100) motivate = "Almost done! Final stretch!";
      else if (pct === 100) motivate = "🎉 All done! You're ready to code!";
      document.getElementById('prog-encouragement').textContent = motivate;

      // Render Viewport
      const vp = document.getElementById('slide-viewport');
      vp.classList.remove('animate-slide');
      void vp.offsetWidth; // trigger reflow for smooth slide animation
      vp.classList.add('animate-slide');
      vp.innerHTML = renderSlideContent(current.id);

      // Update Footer Buttons
      document.getElementById('btn-prev').disabled = idx === 0;
      const nextBtn = document.getElementById('btn-next');
      const nextLabel = document.getElementById('btn-next-label');
      if (idx === total - 1) {
        nextLabel.textContent = 'Back to Start';
      } else {
        nextLabel.textContent = idx === 0 ? 'Start Guided Setup' : 'Next Step';
      }

      // Render All-Pages Drawer List
      const drawerList = document.getElementById('map-drawer-list');
      drawerList.innerHTML = deck.map((s, i) => `
        <button type="button" onclick="goToSlide('${s.id}'); toggleMapDrawer();" class="w-full text-left px-3.5 py-2.5 rounded-xl border-2 border-[#2b2d22] flex items-center justify-between text-xs sm:text-sm font-bold transition ${s.id === current.id ? 'bg-[#e07a2e] text-white' : (i < idx ? 'bg-[#e6f2d9] text-[#2b2d22]' : 'bg-white hover:bg-[#f6e58d]')}">
          <span>${i + 1}. ${escapeHtml(s.title)}</span>
          <span class="font-mono-code text-xs">${s.id === current.id ? '👈 Current' : (i < idx ? '✓' : '')}</span>
        </button>
      `).join('');

      saveState();
    }

    function stepNext() {
      const deck = getSlideDeck();
      const idx = deck.findIndex(s => s.id === state.slideId);
      if (idx < deck.length - 1) {
        state.slideId = deck[idx + 1].id;
      } else {
        state.slideId = deck[0].id;
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function stepPrev() {
      const deck = getSlideDeck();
      const idx = deck.findIndex(s => s.id === state.slideId);
      if (idx > 0) {
        state.slideId = deck[idx - 1].id;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function goToSlide(id) {
      const deck = getSlideDeck();
      if (!deck.some(s => s.id === id)) {
        state.track = 'full';
      }
      state.slideId = id;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function pickOS(os) {
      state.os = os;
      render();
      showToast(`Switched to ${os === 'windows' ? '🪟 Windows' : '🐧 Linux'} guide!`);
    }

    function toggleOSQuick() {
      pickOS(state.os === 'windows' ? 'linux' : 'windows');
    }

    function pickTrackAndGo(track) {
      state.track = track;
      const deck = getSlideDeck();
      state.slideId = deck[1] ? deck[1].id : deck[0].id;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setInstallerTab(idx) {
      state.installerPage = idx;
      render();
    }

    function setDistro(d) {
      state.linuxDistro = d;
      render();
    }

    function setLinVsc(m) {
      state.linuxVscMethod = m;
      render();
    }

    function pickAuth(m) {
      state.authMethod = m;
      render();
      stepNext();
    }

    function updateUserField(field, val) {
      state[field] = val;
      saveState();
      // Update command boxes live without losing input focus
      const pres = document.querySelectorAll('.terminal-body');
      if (state.slideId === 'cfg_identity' && pres[0]) {
        const n = state.userName.trim() || 'YOUR_NAME';
        const e = state.userEmail.trim() || 'YOUR_EMAIL@example.com';
        pres[0].textContent = `git config --global user.name "${n}"\ngit config --global user.email "${e}"`;
        cmdRawMap['c_1'] = pres[0].textContent;
      }
    }

    function toggleMapDrawer() {
      document.getElementById('map-drawer').classList.toggle('hidden');
    }

    // Keyboard Left/Right navigation support (when not typing in an input)
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
      if (e.key === 'ArrowRight') stepNext();
      if (e.key === 'ArrowLeft') stepPrev();
    });

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
